<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <h2>เครื่องมือแปลงสกุลเงิน</h2>
        <p class="update-time" id="updateTime">อัปเดตล่าสุด: กำลังโหลด...</p>

        <div class="converter-group">
            <!-- ฝั่งต้นทาง -->
            <div class="row">
                <select id="currency-one">
                    <option value="USD" selected>USD</option>
                    <option value="THB">THB</option>
                    <option value="EUR">EUR</option>
                    <option value="JPY">JPY</option>
                </select>
                <input type="number" id="amount-one" placeholder="0" value="1">
            </div>

            <!-- ส่วนแสดงอัตราแลกเปลี่ยนและปุ่มสลับ -->
            <div class="middle-row">
                <button id="swap" class="btn-swap">สลับสกุลเงิน</button>
                <div class="rate" id="rate">กำลังโหลดอัตราแลกเปลี่ยน...</div>
            </div>

            <!-- ฝั่งปลายทาง -->
            <div class="row">
                <select id="currency-two">
                    <option value="USD">USD</option>
                    <option value="THB" selected>THB</option>
                    <option value="EUR">EUR</option>
                    <option value="JPY">JPY</option>
                </select>
                <input type="number" id="amount-two" placeholder="0">
            </div>
        </div>

        <!-- ปุ่มล้างข้อมูลหลัก -->
        <div class="action-box">
            <button id="clear-btn" class="btn-clear">ล้างข้อมูล</button>
        </div>

        <!-- ส่วนประวัติ -->
        <div class="history-section">
            <div class="history-top">
                <span>ประวัติการแปลง 10 รายการล่าสุด</span>
                <button id="clear-history-btn" class="btn-text">ล้างประวัติ</button>
            </div>
            <ul id="history-list">
                <!-- รายการประวัติ -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
